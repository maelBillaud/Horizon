name: Newsletter de nuit

on:
  schedule:
    - cron: "0 2 * * *"   # 02:00 UTC, soit 03:00 ou 04:00 en France selon la saison
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly-newsletter
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer Horizon
        run: |
          python -m pip install uv==0.11.26
          uv sync
      - name: Générer la newsletter (dernières 24 h)
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: uv run horizon --config data/config.newsletter.json --hours 24
      - name: Préparer le site
        run: |
          mkdir -p newsletter-site/_posts
          cp docs/_posts/*-summary-fr.md newsletter-site/_posts/
          sed -i 's/^title: "Horizon Summary: \(.*\) (FR)"/title: "Revue du matin - \1"/' newsletter-site/_posts/*-summary-fr.md
      - name: Publier sur gh-pages
        run: |
          git config user.name "newsletter-bot"
          git config user.email "newsletter-bot@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin gh-pages > /dev/null; then
            git fetch --depth=1 origin gh-pages
            git worktree add -B gh-pages pages FETCH_HEAD
          else
            git worktree add --detach pages
            git -C pages checkout --orphan gh-pages
            git -C pages rm -rf --quiet .
          fi
          cp -r newsletter-site/. pages/
          git -C pages add -A
          git -C pages diff --cached --quiet || git -C pages commit -m "Newsletter $(date -u +%F)"
          git -C pages push origin gh-pages
