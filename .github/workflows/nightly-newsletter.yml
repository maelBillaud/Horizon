name: Newsletter de nuit

on:
  schedule:
    - cron: "0 2 * * *"   # 02:00 UTC, soit 03:00 ou 04:00 en France selon la saison
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly-newsletter
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Installer Horizon
        run: uv sync
      - name: Générer la newsletter (dernières 24 h)
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: uv run horizon --config data/config.newsletter.json --hours 24
      - name: Préparer le site
        run: |
          mkdir -p newsletter-site/_posts
          cp docs/_posts/*-summary-fr.md newsletter-site/_posts/
          sed -i 's/^title: "Horizon Summary: \(.*\) (FR)"/title: "Revue du matin - \1"/' newsletter-site/_posts/*-summary-fr.md
      - name: Publier sur gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./newsletter-site
          publish_branch: gh-pages
          keep_files: true
          enable_jekyll: true
          commit_message: "Newsletter ${{ github.run_id }}"
